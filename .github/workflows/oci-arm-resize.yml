name: oci-arm-resize

# 和原来的 oci-arm-retry 一样：重试节奏放在 job 内部，不依赖 GitHub schedule。
#   - job 内跑 5 小时循环，容量不足时 sleep 9~11 分钟再试；
#   - 5 小时到了用 gh workflow run 自己续链；
#   - schedule 只是 6 小时一次的 watchdog，真正的重试靠 self-chain。
#
# 目标：优先 4C24G；失败自动降级 4C6G（只扩 CPU）、2C24G（只扩内存）、
# 2C12G（更小的只扩内存）。某个中间步成功后，下一轮不再尝试该步。
# 到达 4C24G 后自动 disable workflow。
#
# 计费提醒（上线前必读）：
#   Oracle Cloud Price List 的 Ampere A1 脚注写的是
#   "Each paid tenancy gets the first 3,000 OCPU hours and 18,000 GB hours per month for free"
#   —— 对 PAYG 来说 4C24G 跑满 31 天正好是 2,976 OCPU-h / 17,856 GB-h，应为 $0。
#   但 Always Free 文档写的是 1,500 OCPU-h / 9,000 GB-h（2C12G）。
#   两页官方口径互相矛盾，没有公开澄清。上线前先在 OCI Billing 设一个 $1 budget alert，
#   扩容后 24~48h 看 Cost Analysis。若真按 1,500/9,000 计费：
#     4C6G 约 $14.76/月（OCPU 超 1,476）、2C24G 约 $13.28/月（内存超 8,856）、4C24G 约 $28/月。
#
# 触发：
#   - workflow_dispatch：默认 dry_run=true，只打印当前规格和候选，不改实例。
#   - schedule：每 6 小时 watchdog；需要 repo variable OCI_RESIZE_ENABLED=true。
#   - self-chain 用 workflow_dispatch，不受该变量限制；要停就 disable workflow。
#   - chain 是内部参数，self-chain 会传 true，用来区分「人工手动触发」。
#
# 通知策略（NOTIFY_WEBHOOK_URL）：
#   - 成功类通知每次都发：扩到 4C24G、中间步扩容成功、发现已是 4C24G。
#   - 启动/进度心跳最多每 7 天一条：手动 workflow_dispatch 除外（总是发一条，
#     方便测 webhook）。上次心跳时间存在 actions cache（.oci-notify-state），
#     schedule watchdog 与 self-chain 的所有 run 共享同一份状态。
#
# 可选：添加 OCI_INSTANCE_ID secret 直接指定实例，避免按 display-name 查找。

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印当前规格和候选，不执行 resize"
        type: boolean
        default: true
      step_preference:
        description: "4C24G 不可用时的中间步优先级"
        type: choice
        options:
          - cpu_first
          - memory_first
          - full_only
        default: cpu_first
      chain:
        description: "内部：由上一轮 self-chain 触发，不计为手动触发"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: oci-arm-resize
  # 不要取消正在 resize/重启的 run；续链会排队等当前 run 结束。
  cancel-in-progress: false

env:
  FULL_OCPUS: "4"
  FULL_MEMORY_GBS: "24"
  CPU_STEP_OCPUS: "4"
  CPU_STEP_MEMORY_GBS: "6"
  MEM_STEP_OCPUS: "2"
  MEM_STEP_MEMORY_GBS: "24"
  SMALL_MEM_STEP_OCPUS: "2"
  SMALL_MEM_STEP_MEMORY_GBS: "12"
  INSTANCE_NAME: "free-arm-1"
  PREFERENCE: ${{ inputs.step_preference || 'cpu_first' }}

jobs:
  resize:
    # watchdog schedule 需要显式打开变量；手动/续链不受影响。
    if: github.event_name != 'schedule' || vars.OCI_RESIZE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Configure OCI CLI
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_KEY_CONTENT" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

          oci iam region list --output table > /dev/null
          echo "OCI CLI OK"

      # 上一次心跳通知的时间戳跨 run 保存；self-chain / schedule 都能读到。
      - name: Restore notification state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .oci-notify-state
          key: oci-arm-resize-notify-${{ github.run_id }}
          restore-keys: |
            oci-arm-resize-notify-

      - name: Retry loop
        id: loop
        env:
          COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
          INSTANCE_ID_SECRET: ${{ secrets.OCI_INSTANCE_ID }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chain != 'true' && 'true' || 'false' }}
          FULL_OCPUS: ${{ env.FULL_OCPUS }}
          FULL_MEMORY_GBS: ${{ env.FULL_MEMORY_GBS }}
          CPU_STEP_OCPUS: ${{ env.CPU_STEP_OCPUS }}
          CPU_STEP_MEMORY_GBS: ${{ env.CPU_STEP_MEMORY_GBS }}
          MEM_STEP_OCPUS: ${{ env.MEM_STEP_OCPUS }}
          MEM_STEP_MEMORY_GBS: ${{ env.MEM_STEP_MEMORY_GBS }}
          SMALL_MEM_STEP_OCPUS: ${{ env.SMALL_MEM_STEP_OCPUS }}
          SMALL_MEM_STEP_MEMORY_GBS: ${{ env.SMALL_MEM_STEP_MEMORY_GBS }}
          INSTANCE_NAME: ${{ env.INSTANCE_NAME }}
          PREFERENCE: ${{ env.PREFERENCE }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          STATE_DIR="$GITHUB_WORKSPACE/.oci-notify-state"
          mkdir -p "$STATE_DIR"

          notify() {
            local message="$1"
            local title="${2:-CFPick OCI}"
            if [ -z "${NOTIFY_WEBHOOK_URL:-}" ]; then
              return 0
            fi
            local payload
            payload=$(jq -n --arg title "$title" --arg message "$message" \
              '{action:"chat", title:$title, message:$message, url:""}')
            curl -sS --max-time 15 -X POST "$NOTIFY_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept-Encoding: identity' \
              -d "$payload" > /dev/null 2>&1 \
              || echo "::warning::notification send failed"
          }

          mark_notified() {
            if [ -n "${NOTIFY_WEBHOOK_URL:-}" ]; then
              mkdir -p "$STATE_DIR"
              date +%s > "$STATE_DIR/last"
            fi
          }

          # 成功类通知：每次都发。
          notify_always() {
            notify "$1" "${2:-CFPick OCI}"
            mark_notified
          }

          # 启动/进度心跳：手动触发总是发，其余最多每 7 天一条。
          notify_heartbeat() {
            local now last age
            now=$(date +%s)
            last=$(cat "$STATE_DIR/last" 2>/dev/null || echo 0)
            case "$last" in ''|*[!0-9]*) last=0 ;; esac
            age=$(( now - last ))
            if [ "$MANUAL" = "true" ] || [ "$age" -ge 604800 ]; then
              echo "发送心跳通知（距上次 ${age}s）"
              notify "$1" "CFPick OCI"
              mark_notified
              # 手动触发的“总是通知”只生效一次，避免每轮循环都刷屏。
              MANUAL=false
            else
              echo "跳过心跳通知（距上次 ${age}s，未满 7 天）"
            fi
          }

          deadline=$(( $(date +%s) + 18000 ))   # 5 小时
          attempt=0
          stop=false

          # 只升不降的候选构造：
          #   4C24G 永远第一；然后按 preference 排 4C6G / 2C24G；2C12G 最后兜底。
          #   已经成功的中间步会因为“不 >= 当前值”或“等于当前值”而被排除。
          build_candidates() {
            cand_ocpus=()
            cand_mem=()
            cand_label=()

            add_candidate_internal() {
              cand_ocpus+=("$1")
              cand_mem+=("$2")
              cand_label+=("$3")
            }

            if [ "$FULL_OCPUS" -ge "$cur_ocpus" ] && [ "$FULL_MEMORY_GBS" -ge "$cur_mem" ] \
               && ! { [ "$cur_ocpus" = "$FULL_OCPUS" ] && [ "$cur_mem" = "$FULL_MEMORY_GBS" ]; }; then
              add_candidate_internal "$FULL_OCPUS" "$FULL_MEMORY_GBS" "4C24G (full)"
            fi

            if [ "$PREFERENCE" != "full_only" ]; then
              cpu_ok=false
              if [ "$CPU_STEP_OCPUS" -ge "$cur_ocpus" ] && [ "$CPU_STEP_MEMORY_GBS" -ge "$cur_mem" ] \
                 && ! { [ "$cur_ocpus" = "$CPU_STEP_OCPUS" ] && [ "$cur_mem" = "$CPU_STEP_MEMORY_GBS" ]; }; then
                cpu_ok=true
              fi

              mem_ok=false
              if [ "$MEM_STEP_OCPUS" -ge "$cur_ocpus" ] && [ "$MEM_STEP_MEMORY_GBS" -ge "$cur_mem" ] \
                 && ! { [ "$cur_ocpus" = "$MEM_STEP_OCPUS" ] && [ "$cur_mem" = "$MEM_STEP_MEMORY_GBS" ]; }; then
                mem_ok=true
              fi

              small_ok=false
              if [ "$SMALL_MEM_STEP_OCPUS" -ge "$cur_ocpus" ] && [ "$SMALL_MEM_STEP_MEMORY_GBS" -ge "$cur_mem" ] \
                 && ! { [ "$cur_ocpus" = "$SMALL_MEM_STEP_OCPUS" ] && [ "$cur_mem" = "$SMALL_MEM_STEP_MEMORY_GBS" ]; }; then
                small_ok=true
              fi

              if [ "$PREFERENCE" = "memory_first" ]; then
                if [ "$mem_ok" = true ]; then add_candidate_internal "$MEM_STEP_OCPUS" "$MEM_STEP_MEMORY_GBS" "2C24G (memory step)"; fi
                if [ "$cpu_ok" = true ]; then add_candidate_internal "$CPU_STEP_OCPUS" "$CPU_STEP_MEMORY_GBS" "4C6G (cpu step)"; fi
              else
                if [ "$cpu_ok" = true ]; then add_candidate_internal "$CPU_STEP_OCPUS" "$CPU_STEP_MEMORY_GBS" "4C6G (cpu step)"; fi
                if [ "$mem_ok" = true ]; then add_candidate_internal "$MEM_STEP_OCPUS" "$MEM_STEP_MEMORY_GBS" "2C24G (memory step)"; fi
              fi

              if [ "$small_ok" = true ]; then add_candidate_internal "$SMALL_MEM_STEP_OCPUS" "$SMALL_MEM_STEP_MEMORY_GBS" "2C12G (small memory step)"; fi
            fi
          }

          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            echo "=================================================="
            echo "[$(date '+%F %T')] 第 $attempt 轮"

            # 每轮重新按 display-name 找实例；实例 ID 不会变，但这样能兼容重建。
            if [ -n "${INSTANCE_ID_SECRET:-}" ]; then
              instance_id="$INSTANCE_ID_SECRET"
            else
              if ! oci compute instance list \
                  --compartment-id "$COMPARTMENT" \
                  --all \
                  --output json > "$RUNNER_TEMP/instances.json"; then
                echo "::warning::列出实例失败，等 5 分钟"
                sleep 300
                continue
              fi
              instance_id=$(jq -r --arg name "$INSTANCE_NAME" \
                'first((.data // .)[] | select((."display-name" // .displayName) == $name and (."lifecycle-state" // .lifecycleState) != "TERMINATED") | .id) // empty' \
                "$RUNNER_TEMP/instances.json")
            fi

            if [ -z "${instance_id:-}" ] || [ "$instance_id" = "null" ]; then
              echo "::error::找不到实例 $INSTANCE_NAME；请检查 OCI_COMPARTMENT，或添加 OCI_INSTANCE_ID secret"
              sleep 300
              continue
            fi

            oci compute instance get --instance-id "$instance_id" --output json > "$RUNNER_TEMP/instance.json"
            shape=$(jq -r '(.data // .) | .shape // "UNKNOWN"' "$RUNNER_TEMP/instance.json")
            cur_ocpus=$(jq -r '(.data // .) | ((."shape-config" // .shapeConfig) // {}) | ((.ocpus // 0) | floor)' "$RUNNER_TEMP/instance.json")
            cur_mem=$(jq -r '(.data // .) | ((."shape-config" // .shapeConfig) // {}) | ((."memoryInGBs" // .memoryInGbs // ."memory-in-gbs" // 0) | floor)' "$RUNNER_TEMP/instance.json")
            state=$(jq -r '(.data // .) | (."lifecycle-state" // .lifecycleState // "UNKNOWN")' "$RUNNER_TEMP/instance.json")

            echo "当前：$shape / ${cur_ocpus} OCPU / ${cur_mem} GB / state=$state"

            if [ "$shape" != "VM.Standard.A1.Flex" ]; then
              echo "::error::实例不是 VM.Standard.A1.Flex，停止"
              exit 1
            fi

            if [ "$cur_ocpus" = "$FULL_OCPUS" ] && [ "$cur_mem" = "$FULL_MEMORY_GBS" ]; then
              echo "✅ 已经是 4C24G，停止"
              notify_always "✅ 已经是 4C24G（run $GITHUB_RUN_ID），workflow 即将停用" "CFPick OCI"
              stop=true
              break
            fi

            if [ "$state" = "STOPPED" ]; then
              echo "实例 STOPPED，先启动"
              oci compute instance action \
                --instance-id "$instance_id" \
                --action START \
                --wait-for-state RUNNING \
                --max-wait-seconds 600 \
                --wait-interval-seconds 10 || true
              sleep 10
              continue
            fi

            if [ "$state" != "RUNNING" ]; then
              echo "实例状态 $state，等 30 秒"
              sleep 30
              continue
            fi

            notify_heartbeat "📊 OCI 扩容周报：当前 $shape ${cur_ocpus}C/${cur_mem}G，仍在等待 4C24G 容量（run $GITHUB_RUN_ID）" "CFPick OCI"

            build_candidates
            candidate_count=${#cand_ocpus[@]}

            if [ "$candidate_count" -eq 0 ]; then
              echo "当前规格已在目标之上，没有可提升候选；停用 workflow"
              stop=true
              break
            fi

            echo "候选顺序：${cand_label[*]}"

            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run：不执行 resize，退出"
              exit 0
            fi

            round_ok=false
            hard_error=false

            for idx in "${!cand_ocpus[@]}"; do
              target_ocpus="${cand_ocpus[$idx]}"
              target_mem="${cand_mem[$idx]}"
              target_label="${cand_label[$idx]}"

              echo "----- 尝试 $target_label -> ${target_ocpus} OCPU / ${target_mem} GB -----"

              if ! oci compute instance update \
                  --instance-id "$instance_id" \
                  --shape-config "{\"ocpus\":${target_ocpus},\"memoryInGBs\":${target_mem}}" \
                  --update-operation-constraint ALLOW_DOWNTIME \
                  --force \
                  --no-retry \
                  --output json > "$RUNNER_TEMP/update.json" 2> "$RUNNER_TEMP/update.err"; then
                cat "$RUNNER_TEMP/update.err" || true
                if grep -qi "Out of host capacity" "$RUNNER_TEMP/update.err"; then
                  echo "::warning::$target_label 容量不足，尝试下一个候选"
                  oci compute instance get --instance-id "$instance_id" --output json > "$RUNNER_TEMP/after_fail.json" || true
                  after_state=$(jq -r '(.data // .) | (."lifecycle-state" // .lifecycleState // "UNKNOWN")' "$RUNNER_TEMP/after_fail.json" 2>/dev/null || echo "UNKNOWN")
                  if [ "$after_state" != "RUNNING" ]; then
                    echo "update 失败后实例状态 $after_state，交给下一轮恢复"
                    break
                  fi
                  continue
                fi
                echo "::error::$target_label update 失败（非容量原因）"
                hard_error=true
                break
              fi

              cat "$RUNNER_TEMP/update.json"

              # update 返回成功；等待目标规格 + RUNNING，最多 10 分钟。
              target_ok=false
              for _ in $(seq 1 40); do
                oci compute instance get --instance-id "$instance_id" --output json > "$RUNNER_TEMP/post.json"
                now_ocpus=$(jq -r '(.data // .) | ((."shape-config" // .shapeConfig) // {}) | ((.ocpus // 0) | floor)' "$RUNNER_TEMP/post.json")
                now_mem=$(jq -r '(.data // .) | ((."shape-config" // .shapeConfig) // {}) | ((."memoryInGBs" // .memoryInGbs // ."memory-in-gbs" // 0) | floor)' "$RUNNER_TEMP/post.json")
                now_state=$(jq -r '(.data // .) | (."lifecycle-state" // .lifecycleState // "UNKNOWN")' "$RUNNER_TEMP/post.json")
                echo "post: ${now_ocpus} OCPU / ${now_mem} GB, state=$now_state"

                if [ "$now_ocpus" = "$target_ocpus" ] && [ "$now_mem" = "$target_mem" ] && [ "$now_state" = "RUNNING" ]; then
                  target_ok=true
                  break
                fi
                if [ "$now_state" = "STOPPED" ]; then
                  break
                fi
                sleep 15
              done

              if [ "$target_ok" = true ]; then
                round_ok=true
                if [ "$target_ocpus" = "$FULL_OCPUS" ] && [ "$target_mem" = "$FULL_MEMORY_GBS" ]; then
                  echo "✅ 已扩到 4C24G"
                  notify_always "✅ 已扩到 4C24G（run $GITHUB_RUN_ID），workflow 即将停用" "CFPick OCI"
                  stop=true
                else
                  echo "✅ 中间步 $target_label 成功，立即进入下一轮继续冲 4C24G"
                  notify_always "分步扩容成功：$target_label；继续冲 4C24G（run $GITHUB_RUN_ID）" "CFPick OCI"
                fi
                break
              fi

              echo "::warning::$target_label update 返回成功但 10 分钟内规格未生效"
              hard_error=true
              break
            done

            if [ "$stop" = true ]; then
              break
            fi

            if [ "$round_ok" = true ]; then
              # 中间步成功：立即下一轮，重新读规格并只尝试还没完成的步骤。
              continue
            fi

            if [ "$hard_error" = true ]; then
              echo "本轮遇到硬错误，等 5 分钟再试"
              sleep 300
              continue
            fi

            echo "本轮所有候选都 Out of host capacity，等 9~11 分钟再试"
            sleep $((540 + RANDOM % 120))
          done

          if [ "$stop" = true ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
          else
            echo "5 小时窗口结束，续链下一段"
            echo "chain=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save notification state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .oci-notify-state
          key: oci-arm-resize-notify-${{ github.run_id }}

      - name: Disable workflow on success
        if: steps.loop.outputs.stop == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow disable oci-arm-resize.yml --repo "$GITHUB_REPOSITORY" || true

      - name: Chain next 5-hour window
        if: steps.loop.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run oci-arm-resize.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f dry_run=false \
            -f chain=true \
            -f step_preference="$PREFERENCE"
