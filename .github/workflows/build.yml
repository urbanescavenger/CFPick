name: Compile CFPick LuCI App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG: luci-app-cfpick

jobs:
  build:
    # Pin the runner: ubuntu-latest rolled to 26.04, where the deadsnakes PPA
    # no longer ships python3.9 (the workflow needs it for po2lmo).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # tag 触发时把 Makefile 的 PKG_VERSION 注入为 tag 版本号（去掉前导 v），
      # 使构建产物文件名带真实版本（如 luci-app-cfpick_1.0.0_all.ipk）。
      # main 分支构建不改，保持 Makefile 内 PKG_VERSION 字面值（仅作编译校验）。
      - name: Inject PKG_VERSION from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$version/" Makefile
          echo "Injected PKG_VERSION=$version"

      - name: Get version from Makefile
        id: get_version
        run: |
          version=$(grep 'PKG_VERSION:=' Makefile \
                    | awk -F ':=' '{print $2}' \
                    | xargs)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Current Makefile Version: ${version}"

      - name: Resolve latest snapshot SDK URL
        id: snapsdk
        continue-on-error: true
        run: |
          base="https://downloads.openwrt.org/snapshots/targets/x86/64/"
          file="$(curl --http1.1 -sSLk --retry 3 --retry-all-errors "$base" | grep -oE 'openwrt-sdk-x86-64_[A-Za-z0-9._-]+\.tar\.zst' | head -n1)"
          # 解析失败不阻断：下载步骤会按各镜像目录自行找文件名；APK 只是可选产物。
          echo "url=${base}${file}" >> "$GITHUB_OUTPUT"
          echo "Resolved snapshot SDK: ${base}${file}"

      - name: Install system dependencies & po2lmo
        run: |
          sudo apt-get update
          sudo apt install software-properties-common
          sudo add-apt-repository ppa:deadsnakes/ppa
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y curl git tar zstd python3-pip python3.9 python3.9-distutils
          pip3 install --upgrade pip
          pip3 install po2lmo

      - name: Download Legacy OpenWrt SDK
        run: |
          mkdir -p /tmp/SDK
          curl --http1.1 -SLk -C - --connect-timeout 30 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 900 --speed-limit 10240 --speed-time 60 \
            "https://archive.openwrt.org/releases/21.02.0/targets/x86/64/openwrt-sdk-21.02.0-x86-64_gcc-8.4.0_musl.Linux-x86_64.tar.xz" \
            -o /tmp/SDK.tar.xz
          tar xf /tmp/SDK.tar.xz --strip-components=1 -C /tmp/SDK

      # The package Makefile copies debian/ into PKG_BUILD_DIR via a
      # Build/Prepare hook.  Stage it into ./root as well: this keeps the
      # package correct even if an older luci.mk does not expand the hook,
      # and makes the artifact verification below meaningful.
      - name: Stage standalone engine
        run: |
          mkdir -p root/usr/lib/cfpick
          cp -R debian/cfpick debian/data root/usr/lib/cfpick/

      - name: Copy source into Legacy SDK
        run: |
          mkdir -p /tmp/SDK/package/${PKG}
          rsync -avh --exclude='.git' . /tmp/SDK/package/${PKG}

      # IPK/opkg（OpenWrt 24.10 及更早）先构建：这是绝大多数路由器的实际需求，
      # 不能被后面快照 SDK 的下载问题拖垮。
      - name: Compile IPK with Legacy SDK
        run: |
          cd /tmp/SDK
          ./scripts/feeds update -a
          ./scripts/feeds install ${PKG}
          echo "CONFIG_PACKAGE_${PKG}=y" > .config
          make defconfig
          make package/${PKG}/compile V=99

      # Snapshot SDK 是 APK（25.x/主干）构建所需的，体积大且镜像不稳；
      # 失败/超时只跳过 APK，IPK 仍然照常打包发布。
      - name: Download Snapshot OpenWrt SDK
        id: snapsecdk
        continue-on-error: true
        timeout-minutes: 70
        run: |
          mkdir -p /tmp/SNAPSDK
          url="${{ steps.snapsdk.outputs.url }}"
          official="${url##*/}"
          ok=false
          for base in \
            "https://downloads.openwrt.org/snapshots/targets/x86/64" \
            "https://mirrors.ustc.edu.cn/openwrt/snapshots/targets/x86/64"; do
            # 快照每日重建，各镜像同步有延迟：优先用镜像目录里的最新文件名。
            mfile="$(curl --http1.1 -fsSLk --connect-timeout 20 --max-time 90 \
                --retry 2 --retry-all-errors "$base/" 2>/dev/null \
                | grep -oE 'openwrt-sdk-x86-64_[A-Za-z0-9._-]+\.tar\.zst' | head -n1)"
            [ -n "$mfile" ] || mfile="$official"
            echo "镜像: $base/$mfile"
            if [ -f /tmp/SNAPSDK/.name ] && [ "$(cat /tmp/SNAPSDK/.name)" != "$mfile" ]; then
              rm -f /tmp/SNAPSDK.tar.zst
            fi
            echo "$mfile" > /tmp/SNAPSDK/.name
            # 显式续传循环：--retry 不会重新计算 -C - 的断点，断流后必须启动
            # 新的 curl 进程才会按当前文件大小续传。
            attempt=0
            while [ "$attempt" -lt 12 ]; do
              attempt=$((attempt + 1))
              if curl --http1.1 -fSLk -C - --connect-timeout 30 \
                  --max-time 900 --speed-limit 10240 --speed-time 60 \
                  "$base/$mfile" -o /tmp/SNAPSDK.tar.zst; then
                break
              fi
              # 可能已经下完整（服务端返回 416），先校验再决定是否继续。
              if zstd -t /tmp/SNAPSDK.tar.zst >/dev/null 2>&1; then
                break
              fi
              echo "第 ${attempt} 次中断，5s 后续传（已有 $(stat -c%s /tmp/SNAPSDK.tar.zst 2>/dev/null || echo 0) 字节）"
              sleep 5
            done
            if zstd -t /tmp/SNAPSDK.tar.zst >/dev/null 2>&1; then
              ok=true
              break
            fi
            echo "镜像失败，换下一个: $base"
          done
          if [ "$ok" != "true" ]; then
            echo "Snapshot SDK 下载失败：本次跳过 APK，继续发布 IPK"
            exit 1
          fi
          zstd -d /tmp/SNAPSDK.tar.zst
          tar xf /tmp/SNAPSDK.tar --strip-components=1 -C /tmp/SNAPSDK

      - name: Copy source into Snapshot SDK
        if: steps.snapsecdk.outcome == 'success'
        run: |
          mkdir -p /tmp/SNAPSDK/package/${PKG}
          rsync -avh --exclude='.git' . /tmp/SNAPSDK/package/${PKG}

      - name: Compile APK with Snapshot SDK
        if: steps.snapsecdk.outcome == 'success'
        run: |
          cd /tmp/SNAPSDK
          ./scripts/feeds update -a
          ./scripts/feeds install ${PKG}
          echo "CONFIG_PACKAGE_${PKG}=y" > .config
          make defconfig
          make package/${PKG}/compile V=99

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/SDK/bin/packages/x86_64/base/luci-*_all.ipk "./artifacts/"
          if [ -d /tmp/SNAPSDK/bin/packages/x86_64/base ]; then
            cp /tmp/SNAPSDK/bin/packages/x86_64/base/luci-*.apk "./artifacts/" || true
          fi
          echo "v${{ steps.get_version.outputs.version }}" > artifacts/version.txt

      - name: Verify standalone engine is packaged
        run: |
          ipk=$(ls artifacts/*.ipk | head -n1)
          [ -n "$ipk" ] || { echo "no ipk produced"; exit 1; }
          rm -rf /tmp/ipkcheck && mkdir -p /tmp/ipkcheck
          tar xzf "$ipk" -C /tmp/ipkcheck ./data.tar.gz
          tar tzf /tmp/ipkcheck/data.tar.gz | grep -q '^\./usr/lib/cfpick/cfpick/engine.py$' \
            || { echo "standalone engine missing from $ipk"; exit 1; }
          tar tzf /tmp/ipkcheck/data.tar.gz | grep -q '^\./usr/bin/cfpick$' \
            || { echo "cfpick wrapper missing from $ipk"; exit 1; }
          tar tzf /tmp/ipkcheck/data.tar.gz | grep -q '^\./www/cfpick/cgi-bin/api$' \
            || { echo "console CGI missing from $ipk"; exit 1; }
          echo "standalone engine present in $ipk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CFPick-${{ steps.get_version.outputs.version }}
          path: artifacts

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/*
          name: CFPick ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}